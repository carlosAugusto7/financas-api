spring.application.name=financas-api

# Banco H2 em memória (não ocupa disco nem memória persistente)
spring.datasource.url=jdbc:h2:mem:financasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 acessível pelo navegador em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Atualiza as tabelas automaticamente baseando-se nas entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave da API do Gemini (coloque sua chave aqui para testes)
gemini.api.key=${GEMINI_API_KEY:sua_chave_aqui}